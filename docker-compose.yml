services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: pg16
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE} -h localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro

  flyway-migrate:
    image: flyway/flyway:10
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
      FLYWAY_USER: ${PGUSER}
      FLYWAY_PASSWORD: ${PGPASSWORD}
      FLYWAY_SCHEMAS: ${FLYWAY_SCHEMAS}
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_LOCATIONS: filesystem:/flyway/project/modules/${MODULE}/sql/baseline,filesystem:/flyway/project/modules/${MODULE}/sql/migrations
    command: migrate
    volumes:
      - ./:/flyway/project:ro
    restart: "no"

  db-tests:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
      flyway-migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${PGPASSWORD}
    command:
      [
        "sh",
        "-c",
        "set -e; mkdir -p /tests_output; if ls /tests/*.sql >/dev/null 2>&1; then for f in /tests/*.sql; do echo \"==> Executando $$(basename \"$$f\")\"; psql -X -v ON_ERROR_STOP=1 -P pager=off -P footer=off -h ${PGHOST} -p ${PGPORT} -U ${PGUSER} -d ${PGDATABASE} -f \"$$f\"; done; else echo \"Nenhum teste SQL encontrado para o módulo ${MODULE}.\"; fi; ls -lah /tests_output"
      ]
    volumes:
      - ./modules/${MODULE}/tests:/tests:ro
      - ./tests_output:/tests_output
    restart: "no"

volumes:
  pgdata:
