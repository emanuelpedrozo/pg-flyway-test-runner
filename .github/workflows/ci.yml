name: Flyway + SQL Tests + Viewer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [dpg, prepreenchido]

    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: dpg_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dpg_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Descobrir conteúdo do módulo
        id: module_scan
        env:
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          sql_files=(modules/${MODULE}/sql/baseline/V*.sql modules/${MODULE}/sql/migrations/V*.sql)
          test_files=(modules/${MODULE}/tests/*.sql)

          if (( ${#sql_files[@]} > 0 )); then
            echo "has_sql=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sql=false" >> "$GITHUB_OUTPUT"
          fi

          if (( ${#test_files[@]} > 0 )); then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

          echo "[module] ${MODULE}"
          echo "[sql] ${#sql_files[@]} arquivo(s)"
          echo "[tests] ${#test_files[@]} arquivo(s)"

      - name: Instalar Flyway CLI
        if: steps.module_scan.outputs.has_sql == 'true'
        run: |
          curl -sL https://download.red-gate.com/maven/release/com/redgate/flyway/flyway-commandline/10.22.0/flyway-commandline-10.22.0-linux-x64.tar.gz \
            | tar xz
          sudo ln -sf "$PWD/flyway-10.22.0/flyway" /usr/local/bin/flyway
          flyway -v

      - name: Aplicar baseline e migrações
        if: steps.module_scan.outputs.has_sql == 'true'
        env:
          MODULE: ${{ matrix.module }}
          FLYWAY_URL: jdbc:postgresql://localhost:5432/dpg_dev
          FLYWAY_USER: postgres
          FLYWAY_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          FLYWAY_SCHEMAS: geometry_bases
          FLYWAY_CLEAN_DISABLED: "true"
        run: |
          set -euo pipefail
          flyway -locations="filesystem:./modules/${MODULE}/sql/baseline,filesystem:./modules/${MODULE}/sql/migrations" migrate
          flyway info

      - name: Rodar testes SQL do módulo
        if: steps.module_scan.outputs.has_sql == 'true' && steps.module_scan.outputs.has_tests == 'true'
        env:
          MODULE: ${{ matrix.module }}
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "tests_output/${MODULE}"
          docker run --rm --network host \
            -e PGPASSWORD="${PGPASSWORD}" \
            -v "${{ github.workspace }}/modules/${MODULE}/tests:/tests:ro" \
            -v "${{ github.workspace }}/tests_output/${MODULE}:/tests_output" \
            postgres:16 \
            sh -lc 'set -euo pipefail;
              for f in /tests/*.sql; do
                echo "==> Executando $(basename "$f")";
                psql -X -v ON_ERROR_STOP=1 -P pager=off -P footer=off \
                     -h localhost -p 5432 -U postgres -d dpg_dev -f "$f";
              done'
          sudo chown -R $USER:$USER "tests_output/${MODULE}" || true
          ls -lah "tests_output/${MODULE}"

      - name: Validar JSONs gerados
        if: steps.module_scan.outputs.has_tests == 'true'
        env:
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          mkdir -p "tests_output/${MODULE}"
          cd "tests_output/${MODULE}"
          python - <<'PY'
          import json, glob, sys
          files = sorted(glob.glob("*_result.json"))
          if not files:
              print("[warn] Nenhum *_result.json encontrado.")
              sys.exit(0)
          for p in files:
              with open(p, "r", encoding="utf-8") as f:
                  json.load(f)
              print(f"[ok] JSON válido: {p}")
          PY

      - name: Upload dos artefatos de testes (.json)
        if: steps.module_scan.outputs.has_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sql-test-results-${{ matrix.module }}
          path: tests_output/${{ matrix.module }}/*.json
          if-no-files-found: warn

      - name: Montar site do módulo (viewer + manifest)
        if: steps.module_scan.outputs.has_tests == 'true'
        env:
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail
          rm -rf viewer
          mkdir -p viewer

          cp -f "tests_output/${MODULE}"/*_result.json viewer/ 2>/dev/null || true

          python - <<'PY'
          import json, glob, os
          files = sorted([os.path.basename(p) for p in glob.glob("viewer/*_result.json")])
          with open("viewer/manifest.json", "w", encoding="utf-8") as f:
              json.dump(files, f, ensure_ascii=False, indent=2)
          print("[viewer] manifest.json:", files)
          PY

          cp .github/viewer_template.html viewer/index.html
          echo "build: ${{ github.sha }} @ $(date -u +%FT%TZ)" > viewer/build.txt

      - name: Publicar viewer no GitHub Pages
        if: github.event_name != 'pull_request' && steps.module_scan.outputs.has_tests == 'true' && hashFiles('viewer/**') != ''
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./viewer
          destination_dir: ${{ matrix.module }}
          keep_files: true
          commit_message: "deploy: viewer/${{ matrix.module }} (${{ github.sha }})"
